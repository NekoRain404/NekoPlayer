name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Superseded force-pushes should not keep a stale run alive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-smoke:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
      options: --shm-size=1g
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja pkgconf qt6-base qt6-tools mpv ffmpeg mesa \
            fontconfig noto-fonts noto-fonts-cjk
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug -j 4
      # The hosted container has no GPU/audio/display, and libmpv's video
      # pipeline (frame stepping, media-info refresh) is not deterministic
      # there. Keep CI to a build + core-logic smoke set; the full suite and
      # the X11 window preset are desktop-run acceptance gates.
      - name: Smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
          HOME: /tmp/neko-home
          XDG_CACHE_HOME: /tmp/neko-home/.cache
          XDG_CONFIG_HOME: /tmp/neko-home/.config
          XDG_RUNTIME_DIR: /tmp/neko-run
          TMPDIR: /tmp/neko-tmp
        run: |
          mkdir -p "$HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR" "$TMPDIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          fc-cache -f >/dev/null
          ctest --preset debug --output-on-failure --timeout 180 -R \
            '^(code-size|backend-startup|media-source|m3u8-store|playback-time|command-line-arguments|media-library|folder-scan|thumbnail-decoder|thumbnail-service|recent-media-history|playback-history-store|track-preference-store|interaction-preferences|language-preferences|media-report|playlist-file|playlist-block-move|single-instance)$'

  windows-msys2:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ffmpeg
      - name: Configure
        run: cmake --preset windows
      - name: Build
        run: cmake --build --preset windows -j 4
      - name: Smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --preset windows --output-on-failure --timeout 180 -R \
            '^(code-size|backend-startup|media-source|m3u8-store|playback-time|command-line-arguments|media-library|folder-scan|thumbnail-decoder|thumbnail-service|recent-media-history|playback-history-store|track-preference-store|interaction-preferences|language-preferences|media-report|playlist-file|playlist-block-move|single-instance)$'
      - name: Repeat teardown-sensitive tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --preset windows --output-on-failure --timeout 120 --repeat until-fail:5 \
            -R '^(interaction-preferences|language-preferences)$'
      - name: Diagnose failing smoke tests
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          for test in folder_scan_test track_preference_store_test \
              interaction_preferences_test language_preferences_test \
              single_instance_test media_library_test thumbnail_service_test; do
            echo "===== $test"
            "./build/windows/tests/$test.exe" -o "$test.txt,txt" 2>&1 | tail -40
            echo "exit=${PIPESTATUS[0]}"
            [ -f "$test.txt" ] && cat "$test.txt"
          done
