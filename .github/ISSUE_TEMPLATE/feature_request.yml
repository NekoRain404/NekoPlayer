name: 功能建议
description: 提出可验证的播放器能力或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 描述使用场景与当前障碍，而不是只给出实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 菜单入口、快捷键、状态与边界条件。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与影响
      description: 是否影响现有快捷键、会话格式、播放列表或性能。
